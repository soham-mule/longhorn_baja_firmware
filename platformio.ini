; Three firmware images, one repo:
;
;   pico           (default) Baja Sensor ECU datalogger: BNO055 + GPS -> microSD.
;                  Built per the firmware specification/handoff document in
;                  src/ (Baja Sensor ECU). This is what gets flashed on car 185.
;   pico_imu_test  Breadboard MPU6050 wiring test. BENCH ONLY: it drives I2C on
;                  GP4/GP5, which on the ECU board are SD card SPI lines.
;   pico_ekf       On-target ESKF experiment (MPU6050 + Eigen). Superseded by
;                  the log-raw / filter-offline architecture; kept for reference
;                  and as the basis of the offline filter.
;
;   pio run -t upload -t monitor                    -> datalogger
;   pio run -e pico_imu_test -t upload -t monitor   -> MPU6050 wiring test

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
upload_protocol = picotool
build_flags =
    -Wall
    -Wextra
    -DPICO_STDIO_USB=1
build_src_filter = +<*> -<mpu6050_test.cpp> -<ekf_demo.cpp> -<ekf.cpp>
lib_deps =
    greiman/SdFat @ ^2.2.2
    mikalhart/TinyGPSPlus @ ^1.0.3

[env:pico_imu_test]
extends = env:pico
build_src_filter = +<mpu6050_test.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:pico_ekf]
extends = env:pico
build_src_filter = +<ekf_demo.cpp> +<ekf.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -I lib/eigen/eigen_src
    -std=gnu++17
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_NO_MALLOC
    -DEIGEN_MAX_ALIGN_BYTES=0
    -Wdouble-promotion
build_unflags = -std=gnu++11
