; Default env `pico` builds the vehicle firmware (src/main.cpp owns setup/loop).
; `pico_imu_test` builds only the standalone MPU6050 wiring-test sketch.
;   pio run                          -> vehicle firmware
;   pio run -e pico_imu_test -t upload -t monitor
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14

build_src_filter = +<*> -<mpu6050_test.cpp>

build_flags =
    -I lib/eigen/eigen_src
    -std=gnu++17
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_NO_MALLOC
    -DEIGEN_MAX_ALIGN_BYTES=0
    -Wdouble-promotion
build_unflags = -std=gnu++11

[env:pico_imu_test]
extends = env:pico
build_src_filter = +<mpu6050_test.cpp>
